# Erstellt bzw. aktualisiert automatisch das GitHub-Release der aktuellen Firmware-Version.
#
# Auslöser:
#  - Push auf main, der eine Datei in firmware/ (oder diesen Workflow) ändert
#  - Push eines Versions-Tags vX.Y.Z
#  - manuell: Actions → Release → "Run workflow"
#
# Die Version kommt aus FW_VERSION in PCBuddy/config.h (bzw. aus dem Tag).
# Angehängt werden (falls vorhanden):
#   firmware/PCBuddy_full_vX.Y.Z.bin     Komplett-Firmware für die Erstinstallation (an 0x0 flashen)
#   firmware/PCBuddy_update_vX.Y.Z.bin   Update-Datei für das Update per WLAN
# Der Text kommt aus CHANGELOG.md. Gibt es das Release schon, werden Dateien und Text aktualisiert.
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version, Dateien und Release-Text bestimmen
        id: prep
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VER=$(sed -n 's/^#define FW_VERSION[[:space:]]*"\(.*\)".*/\1/p' PCBuddy/config.h)
            TAG="v${VER}"
          fi
          echo "Version: $TAG"

          UPD="firmware/PCBuddy_update_${TAG}.bin"
          FULL="firmware/PCBuddy_full_${TAG}.bin"
          if [ ! -f "$UPD" ] && [ ! -f "$FULL" ]; then
            echo "::error::Keine Firmware für $TAG in firmware/ gefunden."
            exit 1
          fi
          FILES=""
          [ -f "$FULL" ] && FILES="$FILES $FULL"
          [ -f "$UPD" ]  && FILES="$FILES $UPD"

          # Abschnitt "## <tag>" aus dem Changelog übernehmen
          awk -v t="## ${TAG}" '$0==t{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          {
            echo
            echo "### Downloads"
            echo
            echo "| Datei | Wofür |"
            echo "|---|---|"
            [ -f "$FULL" ] && echo "| \`PCBuddy_full_${TAG}.bin\` | **Komplette Firmware** für die Erstinstallation per USB, an Adresse **0x0** flashen. Setzt die Einstellungen zurück, danach startet das WLAN-Setup. |"
            [ -f "$UPD" ]  && echo "| \`PCBuddy_update_${TAG}.bin\` | **Update per WLAN** für ein bereits eingerichtetes Gerät. Die Einstellungen bleiben erhalten. |"
            echo "| *Source code* | Arduino-Sketch \`PCBuddy/PCBuddy.ino\` zum selbst Kompilieren |"
            echo
            echo "### Erstinstallation (ohne Arduino IDE)"
            echo
            echo "1. [ESP Web Tool](https://espressif.github.io/esptool-js/) in Chrome oder Edge öffnen und den ESP32-C3 per USB-C anschließen"
            echo "2. *Connect* → Port wählen. Klappt es nicht: **BOOT** gedrückt halten, kurz **RESET**, BOOT loslassen."
            echo "3. *Erase Flash*, dann Flash Address **0x0** und \`PCBuddy_full_${TAG}.bin\` wählen → *Program*"
            echo "4. Nach dem Neustart mit dem WLAN **PCBuddy-Setup** verbinden und einrichten"
            echo
            echo "Oder per Kommandozeile: \`esptool.py --chip esp32c3 write_flash 0x0 PCBuddy_full_${TAG}.bin\`"
            echo
            echo "### Update per WLAN"
            echo
            echo "Dashboard \`http://pcbuddy.local\` → **System → Firmware-Update per WLAN** → \`PCBuddy_update_${TAG}.bin\` wählen → *Update installieren*."
            echo
            echo "Mehr im [README](https://github.com/${GITHUB_REPOSITORY}#installation)."
          } >> notes.md

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Release erstellen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prep.outputs.tag }}
          FILES: ${{ steps.prep.outputs.files }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert – Dateien und Text werden aktualisiert."
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --title "PCBuddy $TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --title "PCBuddy $TAG" --notes-file notes.md --latest
          fi
